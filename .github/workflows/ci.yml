name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        run: pnpm lint && pnpm typecheck

      - name: Unit tests (RNG, auth, XTR, contracts)
        run: pnpm test

      - name: Generate seed snapshot (D-04)
        run: pnpm db:seed:generate

      - name: Migration / seed static checks
        run: pnpm --filter @case-sim/db test

      - name: SQL migrations (PGlite, без Docker)
        run: pnpm db:check

      - name: pgTAP assertions (PGlite, без Docker)
        run: pnpm db:pgtap

      - name: Docs lint
        run: pnpm docs:lint

      - name: Build (web SPA + bot bundle)
        run: pnpm build

      - name: No secrets in client bundle
        run: |
          if grep -RIlE 'BOT_TOKEN|sb_secret_|service_role|SUPABASE_JWT_JWK' apps/web/dist; then
            echo "::error::secret leaked into client bundle"; exit 1;
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

  database:
    # ubuntu-latest уже указывает на Ubuntu 26; Supabase CLI + Docker там
    # нестабильны. Фиксируем 24.04 до официальной поддержки.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:seed:generate
      - name: Supabase CLI version
        run: supabase --version
      - name: Start local Supabase (Docker)
        run: |
          set -o pipefail
          if supabase start 2>&1 | tee /tmp/start.log; then exit 0; fi
          { grep -Ei 'error|fail|fatal|cannot|denied|timed out|psql:|does not exist|invalid' /tmp/start.log \
              | grep -Eiv 'pull complete|downloaded newer image|digest:|public.ecr.aws|status: downloaded' \
              | tail -8; tail -2 /tmp/start.log; } \
            | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      - name: Apply migrations + seed
        run: |
          set -o pipefail
          if supabase db reset 2>&1 | tee /tmp/reset.log; then exit 0; fi
          { grep -Ei 'error|fail|fatal|denied|psql:|does not exist' /tmp/reset.log \
              | grep -Eiv 'pull complete|downloaded newer image|digest:' | tail -8; tail -2 /tmp/reset.log; } \
            | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      - name: Ensure catalog seed (14 945 items, 241 cases)
        # db push его не грузит, а sql_paths может отличаться между версиями CLI —
        # гарантируем наполнение каталога явно, иначе open_case получит NULL item_id.
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          if [ "$(psql "$DB_URL" -tAc 'select count(*) from public.items' | tr -d ' ')" = "0" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          fi
      - name: pgTAP (RLS, idempotency)
        # Логи job'а требуют токен, а annotations доступны публично —
        # дублируем строки провала в annotations для диагностики без секретов.
        run: |
          set -o pipefail
          if supabase test db 2>&1 | tee /tmp/pgtap.log; then
            exit 0
          fi
          grep -E 'not ok|ERROR|error:|Bail out|Failed|failed|psql:|permission denied' /tmp/pgtap.log \
            | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
