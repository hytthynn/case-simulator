project_id = "case-sim"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Версионированные миграции ВСЕГДА лежат в supabase/migrations/ — именно там
# их ищут `supabase db reset` и `supabase db push`. НЕ пытайтесь перенаправить
# их через [db.migrations] schema_paths: этот ключ задаёт порядок ДЕКЛАРАТИВНЫХ
# схем для движка migra и игнорируется pg-delta / db push.
# Сид НЕ применяется автоматически: 5 МБ SQL с psql-директивой `\ir` не всегда
# совместим с загрузчиком CLI и может уронить `supabase start`/`db push`.
# Каталог грузится ЯВНО: ci.yml → "Ensure catalog seed", deploy.yml → seed_catalog=true,
# локально → `supabase db reset` + `psql -f supabase/seed.sql` (см. README §3).
[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://t.me"]
jwt_expiry = 3600
enable_signup = false

[auth.external]
# Telegram-авторизация реализована собственным ES256 JWT (ADR-002),
# встроенные провайдеры Supabase Auth не используются.
